    var c = "denied";
    try {
      var s = JSON.parse(localStorage.getItem("closetlab_consent_v1"));
      if (s && s.choice === "granted") c = "granted";
    } catch (e) {}
    gtag("consent", "default", {
      ad_storage: c,
      ad_user_data: c,
      ad_personalization: c,
      analytics_storage: c
    });
  })();
</script>

<script>
  const order = JSON.parse(sessionStorage.getItem("last_order") || "null");
  const root = document.getElementById("thanks-root");
  if (order) {
    root.innerHTML +=
      '<p>注文番号</p><div class="order-id">' + order.transactionId + '</div>' +
      '<p>お支払い合計: ¥' + order.total.toLocaleString() + '</p>' +

        '<a href="index.html" class="btn">トップページへ戻る</a>' +
        '<button id="refund-btn" class="btn-outline btn">この注文を返品する(ダミー)</button>' +
      '</div>' +
      '<p id="refund-message" style="margin-top:16px; color:var(--text-soft); font-size:13px"></p>';

    document.getElementById("refund-btn").addEventListener("click", function () {
      trackRefund(order.transactionId, order.total, order.items || []);
      document.getElementById("refund-message").textContent =
        "返品を受け付けました(ダミー処理・実際の返金は発生しません)。GA4に refund イベントが送信されました。";
      this.disabled = true;
      this.textContent = "返品受付済み";
    });
  } else {
    root.innerHTML += '<p style="margin-top:24px"><a href="index.html" class="btn">トップページへ戻る</a></p>';
  }
