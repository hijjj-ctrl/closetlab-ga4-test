<script>
  const params = new URLSearchParams(location.search);
  const product = getProductById(params.get("id")) || PRODUCTS[0];
  document.title = product.name + " | TONE LAB - Dummy for GA4";
  document.getElementById("bc-name").textContent = product.name;

  // カラー・サイズは商品ごとに js/products.js で設定しています
  const COLOR_OPTIONS = product.colors;
  const SIZE_OPTIONS = product.sizes;

  document.getElementById("pd-root").innerHTML =
    '<div class="pd-visual" style="background:' + product.color + '"><img src="' + product.image + '" alt="' + product.name + '" onerror="this.remove()"></div>' +
    '<div>' +
      '<h1 class="pd-name">' + product.name + '</h1>' +
      '<div class="pd-price">¥' + product.price.toLocaleString() + '</div>' +
      '<p class="pd-desc">' + product.desc + '</p>' +
      '<div class="form-group"><label>カラー</label><select id="opt-color">' +
        COLOR_OPTIONS.map(c => '<option value="' + c + '">' + c + '</option>').join('') +
      '</select></div>' +
      '<div class="form-group"><label>サイズ</label><select id="opt-size">' +
        SIZE_OPTIONS.map(s => '<option value="' + s + '">' + s + '</option>').join('') +
      '</select></div>' +
      '<div class="qty-row">' +
        '<button type="button" data-qty-minus>−</button>' +
        '<input type="number" id="qty" value="1" min="1" max="10">' +
        '<button type="button" data-qty-plus>+</button>' +
      '</div>' +
      '<div style="display:flex; gap:10px">' +
        '<button class="btn btn-block" id="add-btn">カートに追加</button>' +
        '<button class="btn-outline btn" id="wish-btn" style="flex-shrink:0; padding:14px 20px">♡</button>' +
      '</div>' +
    '</div>';

  // view_item イベント(ページ表示時に1回)
  trackViewItem(product);

  const qtyInput = document.getElementById("qty");
  document.querySelector("[data-qty-minus]").addEventListener("click", function () {
    qtyInput.value = Math.max(1, parseInt(qtyInput.value || 1) - 1);
  });
  document.querySelector("[data-qty-plus]").addEventListener("click", function () {
    qtyInput.value = Math.min(10, parseInt(qtyInput.value || 1) + 1);
  });

  document.getElementById("add-btn").addEventListener("click", function () {
    const qty = Math.max(1, parseInt(qtyInput.value || 1));
    const color = document.getElementById("opt-color").value;
    const size = document.getElementById("opt-size").value;
    const variant = color + " / " + size;
    addToCart(product, qty, variant);
    trackAddToCart(product, qty, variant);
    this.textContent = "カートに追加しました";
    setTimeout(() => { this.textContent = "カートに追加"; }, 1200);
  });

  const wishBtn = document.getElementById("wish-btn");
  function refreshWishBtn() {
    wishBtn.textContent = isInWishlist(product.id) ? "♥" : "♡";
  }
  refreshWishBtn();
  wishBtn.addEventListener("click", function () {
    const added = toggleWishlist(product);
    if (added) trackAddToWishlist(product);
    refreshWishBtn();
  });

  // ---------- 関連商品(同じカテゴリを優先して4点) ----------
  (function () {
    const same = PRODUCTS.filter(function (p) { return p.id !== product.id && p.category === product.category; });
    const others = PRODUCTS.filter(function (p) { return p.id !== product.id && p.category !== product.category; });
    const related = same.concat(others).slice(0, 4);
    const root = document.getElementById("related-root");
    root.innerHTML = '<h2>あわせて見たい</h2><div class="product-grid">' + related.map(function (p) {
      return '<a class="product-card" href="product.html?id=' + p.id + '" data-related="' + p.id + '">' +
        '<div class="product-thumb" style="background:' + p.color + '"><img src="' + p.image + '" alt="' + p.name + '" onerror="this.remove()"></div>' +
        '<div class="product-body"><span class="product-cat">' + p.category + '</span><h3>' + p.name + '</h3>' +
        '<div class="product-price">¥' + p.price.toLocaleString() + '</div></div></a>';
    }).join("") + '</div>';
    trackViewItemList(related, "関連商品");
    root.addEventListener("click", function (e) {
      const a = e.target.closest("[data-related]");
      if (a) trackSelectItem(getProductById(a.getAttribute("data-related")), "関連商品");
    });
  })();
</script>
