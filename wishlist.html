<script>
  function render() {
    const list = getWishlist();
    const root = document.getElementById("wishlist-root");
    if (list.length === 0) {
      root.innerHTML = '<div class="empty-state">お気に入りはまだありません。<br><br><a href="index.html#lineup" class="btn">商品を見る</a></div>';
      return;
    }
    root.innerHTML = '<div class="product-grid">' + list.map(function (w) {
      return '<div class="product-card">' +
        '<div class="product-thumb" style="background:' + w.color + '"><img src="' + w.image + '" alt="' + w.name + '" onerror="this.remove()"></div>' +
        '<div class="product-body">' +
          '<h3>' + w.name + '</h3>' +
          '<div class="product-price">¥' + w.price.toLocaleString() + '</div>' +
          '<div class="product-actions">' +
            '<a class="btn-outline btn" href="product.html?id=' + w.id + '">詳細を見る</a>' +
            '<button class="btn-outline btn" data-remove-wish="' + w.id + '" style="flex:0 0 auto">削除</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  render();

  document.getElementById("wishlist-root").addEventListener("click", function (e) {
    const btn = e.target.closest("[data-remove-wish]");
    if (btn) {
      removeFromWishlist(btn.getAttribute("data-remove-wish"));
      render();
    }
  });
</script>
