<script src="js/journal.js"></script>

<script src="js/analytics.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const post = getJournalPostById(params.get("id")) || JOURNAL_POSTS[0];

  document.title = post.title + " | TONE LAB - Dummy for GA4";
  document.getElementById("bc-title").textContent = post.title;

  const visualHtml = post.videoId
    ? '<div id="video-wrap" style="margin-bottom:32px;border-radius:4px;overflow:hidden;aspect-ratio:16/9;background:#000">' +
        '<div id="yt-player" style="width:100%;height:100%"></div>' +
      '</div>'
    : '<div class="pd-visual" style="background:' + post.color + ';height:320px;margin-bottom:32px"><img src="' + post.image + '" alt="' + post.title + '" onerror="this.remove()"></div>';

  document.getElementById("journal-root").innerHTML =
    visualHtml +
    '<span class="eyebrow">' + post.tag + '</span>' +
    '<h1 style="margin:8px 0 4px">' + post.title + '</h1>' +
    '<p style="color:var(--text-soft);font-size:13px;margin-bottom:32px">' + post.date + '</p>' +
    post.body.map(p => '<p style="margin-bottom:20px">' + p + '</p>').join('');

  // GA4推奨イベント: select_contentの受け皿(記事詳細を実際に閲覧したことを計測)
  sendEvent("select_content", {
    content_type: "journal",
    item_id: post.id,
    content_title: post.title
  });

  // ---------- YouTube動画の視聴計測(video_start / video_progress / video_complete) ----------
  if (post.videoId) {
    const videoProgressFired = {};
    let videoStarted = false;

    window.onYouTubeIframeAPIReady = function () {
      new YT.Player("yt-player", {
        videoId: post.videoId,
        playerVars: { rel: 0 },
        events: {
          onStateChange: function (e) {
            const player = e.target;
            const duration = player.getDuration();

            if (e.data === YT.PlayerState.PLAYING) {
              if (!videoStarted) {
                videoStarted = true;
                sendEvent("video_start", {
                  video_title: post.title,
                  video_provider: "youtube",
                  video_url: "https://youtu.be/" + post.videoId
                });
              }
              // 再生中、一定間隔で進捗(10/25/50/75%)をチェック
              const progressTimer = setInterval(function () {
                if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
                const percent = Math.floor((player.getCurrentTime() / duration) * 100);
                [10, 25, 50, 75].forEach(function (t) {
                  if (percent >= t && !videoProgressFired[t]) {
                    videoProgressFired[t] = true;
                    sendEvent("video_progress", {
                      video_title: post.title,
                      video_percent: t,
                      video_provider: "youtube"
                    });
                  }
                });
              }, 1000);
              player._progressTimer = progressTimer;
            } else if (e.data === YT.PlayerState.ENDED) {
              sendEvent("video_complete", {
                video_title: post.title,
                video_provider: "youtube",
                video_url: "https://youtu.be/" + post.videoId
              });
              if (player._progressTimer) clearInterval(player._progressTimer);
            } else if (e.data === YT.PlayerState.PAUSED) {
              if (player._progressTimer) clearInterval(player._progressTimer);
            }
          }
        }
      });
    };

    const ytScript = document.createElement("script");
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(ytScript);
  }
</script>
</body>
