<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/analytics.js"></script>
<script src="js/consent.js"></script>
<script src="js/main.js"></script>
<script>
  function render() {
    const cart = getCart();
    const root = document.getElementById("cart-root");
    if (cart.length === 0) {
      root.innerHTML = '<div class="empty-state">カートは空です。<br><br><a href="index.html#lineup" class="btn">商品を見る</a></div>';
      return;
    }
    let rows = cart.map(function (c, index) {
      return '<tr data-row="' + index + '">' +
        '<td>' + c.name + (c.variant ? '<br><span style="color:var(--text-soft);font-size:12px">' + c.variant + '</span>' : '') + '</td>' +
        '<td>¥' + c.price.toLocaleString() + '</td>' +
        '<td><input type="number" min="1" max="10" value="' + c.qty + '" data-qty-input="' + index + '" style="width:56px"></td>' +
        '<td>¥' + (c.price * c.qty).toLocaleString() + '</td>' +
        '<td><button data-remove="' + index + '" class="btn-outline btn" style="padding:6px 10px;font-size:12px">削除</button></td>' +
        '</tr>';
    }).join("");

    const total = cartTotal(cart);

    root.innerHTML =
      '<table class="cart-table"><thead><tr><th>商品</th><th>単価</th><th>数量</th><th>小計</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="cart-summary">' +
        '<div class="summary-row"><span>商品合計</span><span>¥' + total.toLocaleString() + '</span></div>' +
        '<div class="summary-row total"><span>合計</span><span>¥' + total.toLocaleString() + '</span></div>' +
        '<button class="btn btn-block" id="checkout-btn" style="margin-top:20px">購入手続きへ進む</button>' +
      '</div>';

    document.getElementById("checkout-btn").addEventListener("click", function () {
      trackBeginCheckout(getCart());
      location.href = "checkout.html";
    });
  }

  render();

  const cart = getCart();
  if (cart.length > 0) {
    trackViewCart(cart);
  }

  document.getElementById("cart-root").addEventListener("change", function (e) {
    const qtyInput = e.target.closest("[data-qty-input]");
    if (qtyInput) {
      const index = parseInt(qtyInput.getAttribute("data-qty-input"));
      updateQuantityAt(index, parseInt(qtyInput.value || 1));
      render();
    }
  });

  document.getElementById("cart-root").addEventListener("click", function (e) {
    const removeBtn = e.target.closest("[data-remove]");
    if (removeBtn) {
      const index = parseInt(removeBtn.getAttribute("data-remove"));
      const item = getCart()[index];
      if (item) trackRemoveFromCart({ sku: item.sku, name: item.name, category: item.category, price: item.price }, item.qty);
      removeFromCartAt(index);
      render();
    }
  });
</script>
</body>
</html>
